apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: monitoring
data:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json
      }
      kubernetes {
        namespace => "geo-engine"
        labels => true
      }
    }

    filter {
      if [type] == "api-log" {
        mutate {
          add_field => { "service" => "api" }
        }
        grok {
          match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:message}" }
        }
      }

      if [type] == "app-log" {
        mutate {
          add_field => { "service" => "application" }
        }
      }

      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }

    output {
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        index => "geo-engine-%{+YYYY.MM.dd}"
      }
      stdout {
        codec => rubydebug
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.8.0
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: logstash-config
          mountPath: /usr/share/logstash/pipeline/
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: logstash-config
        configMap:
          name: logstash-config
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: monitoring
spec:
  selector:
    app: logstash
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
