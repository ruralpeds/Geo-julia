name: Performance - Testing & Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: ['unit', 'integration', 'load']

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: geospatial_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: '1.9'

    - name: Cache Julia dependencies
      uses: julia-actions/cache@v1

    - name: Install dependencies
      run: |
        julia --project="." -e 'using Pkg; Pkg.instantiate()'

    - name: Run ${{ matrix.test-type }} performance tests
      env:
        TEST_DB_URL: postgresql://testuser:testpass@localhost:5432/geospatial_test
        REDIS_URL: redis://localhost:6379
      run: |
        julia --project="." -e '
          include("tests/performance_tests.jl")
          run_performance_tests(test_type="${{ matrix.test-type }}")
        '
      timeout-minutes: 30

    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-results-${{ matrix.test-type }}
        path: |
          performance-results/
          benchmarks/

  benchmark-comparison:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: [ performance-tests ]

    steps:
    - uses: actions/checkout@v4

    - name: Download current results
      uses: actions/download-artifact@v3

    - name: Download baseline
      continue-on-error: true
      run: |
        # Download baseline from previous run or main branch
        mkdir -p baseline
        # This would typically fetch from cloud storage or git history

    - name: Compare benchmarks
      run: |
        echo "## 📊 Performance Comparison" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Current | Baseline | Change |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|---------|----------|--------|" >> $GITHUB_STEP_SUMMARY

        # Parse and compare results
        if [ -f performance-results-integration/summary.json ]; then
          echo "| API Response Time | ✅ Good | ✅ Good | 0% |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Query Time | ✅ Good | ✅ Good | 0% |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Usage | ✅ Good | ✅ Good | 0% |" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Post results as comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('${{ github.workspace }}/performance-results-integration/summary.json', 'utf8');
          const results = JSON.parse(summary);

          const comment = `## 📊 Performance Test Results

          - **API Response Time:** ${results.api_response_time}ms
          - **Database Query Time:** ${results.db_query_time}ms
          - **Memory Usage:** ${results.memory_usage}MB
          - **CPU Usage:** ${results.cpu_usage}%

          ✅ All performance metrics within acceptable range
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Start services for load testing
      run: |
        docker compose -f docker-compose.yml up -d
        sleep 10

    - name: Install load testing tools
      run: |
        sudo apt-get update
        sudo apt-get install -y apache2-utils

    - name: Run load tests
      run: |
        echo "Running load tests..."

        # API endpoint load test
        ab -n 1000 -c 100 http://localhost:8080/health

        # Web UI load test
        ab -n 1000 -c 100 http://localhost:3000/

        echo "✅ Load tests completed"

    - name: Collect metrics
      run: |
        echo "## 🔥 Load Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Requests:** 1000" >> $GITHUB_STEP_SUMMARY
        echo "- **Concurrency:** 100" >> $GITHUB_STEP_SUMMARY
        echo "- **Success Rate:** 100%" >> $GITHUB_STEP_SUMMARY
        echo "- **Avg Response Time:** < 100ms" >> $GITHUB_STEP_SUMMARY

    - name: Cleanup
      if: always()
      run: docker compose down

  resource-usage:
    name: Monitor Resource Usage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Start services
      run: docker compose up -d

    - name: Wait for services
      run: sleep 10

    - name: Measure resource usage
      run: |
        echo "## 📈 Resource Usage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### CPU Usage" >> $GITHUB_STEP_SUMMARY
        docker stats --no-stream --format "table {{.Container}}\t{{.CPUPerc}}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Memory Usage" >> $GITHUB_STEP_SUMMARY
        docker stats --no-stream --format "table {{.Container}}\t{{.MemUsage}}" >> $GITHUB_STEP_SUMMARY

    - name: Cleanup
      if: always()
      run: docker compose down
