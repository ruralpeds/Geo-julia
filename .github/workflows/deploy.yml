name: Deploy - Staging & Production

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure deployment environment
      run: |
        cat > deploy.env << EOF
        ENVIRONMENT=staging
        API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:develop
        WEB_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:develop
        VITE_API_URL=https://api-staging.example.com
        EOF

    - name: Deploy to staging
      env:
        DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
        DEPLOY_USER: ${{ secrets.STAGING_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

        scp -i ~/.ssh/deploy_key docker-compose.yml $DEPLOY_USER@$DEPLOY_HOST:/app/
        scp -i ~/.ssh/deploy_key deploy.env $DEPLOY_USER@$DEPLOY_HOST:/app/.env

        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'ENDSSH'
          cd /app
          docker-compose pull
          docker-compose up -d
          docker-compose exec -T api curl http://localhost:8080/health
        ENDSSH

    - name: Run smoke tests
      env:
        API_URL: https://api-staging.example.com
      run: |
        echo "Running smoke tests against staging..."
        curl -f $API_URL/health || exit 1
        echo "✅ Staging deployment successful"

    - name: Post deployment summary
      run: |
        echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Version |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| API Image | develop |" >> $GITHUB_STEP_SUMMARY
        echo "| Web Image | develop |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**URL:** https://staging.example.com" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ deploy-staging ]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://www.example.com
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=main-$(git rev-parse --short HEAD)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Configure production environment
      run: |
        cat > deploy.env << EOF
        ENVIRONMENT=production
        API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.version.outputs.version }}
        WEB_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ steps.version.outputs.version }}
        VITE_API_URL=https://api.example.com
        POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
        REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }}
        EOF

    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

        # Backup current production
        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'ENDSSH'
          cd /app
          docker-compose exec postgres pg_dump -U geoadmin geospatial | gzip > backups/pre-deploy-$(date +%s).sql.gz
        ENDSSH

        # Deploy new version
        scp -i ~/.ssh/deploy_key docker-compose.yml $DEPLOY_USER@$DEPLOY_HOST:/app/
        scp -i ~/.ssh/deploy_key deploy.env $DEPLOY_USER@$DEPLOY_HOST:/app/.env

        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'ENDSSH'
          cd /app
          docker-compose pull
          docker-compose up -d

          # Wait for services to be healthy
          for i in {1..30}; do
            if docker-compose exec -T api curl http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ API is healthy"
              break
            fi
            echo "Waiting for API to be ready... ($i/30)"
            sleep 2
          done
        ENDSSH

    - name: Run health checks
      env:
        API_URL: https://api.example.com
      run: |
        echo "Running health checks on production..."
        curl -f $API_URL/health || exit 1
        echo "✅ Production deployment successful"

    - name: Post deployment notification
      run: |
        echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**URL:** https://www.example.com" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Backup created before deployment" >> $GITHUB_STEP_SUMMARY

    - name: Create deployment record
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
            environment: 'production',
            description: 'Deployment of ${{ steps.version.outputs.version }}',
            auto_merge: false,
            required_contexts: []
          })

  rollback-production:
    name: Rollback Production (Manual)
    runs-on: ubuntu-latest
    if: failure()
    environment:
      name: production
    permissions:
      contents: read

    steps:
    - name: Trigger rollback
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'ENDSSH'
          cd /app
          # Restore from backup
          LATEST_BACKUP=$(ls -t backups/pre-deploy-*.sql.gz | head -1)
          if [ -n "$LATEST_BACKUP" ]; then
            docker-compose exec -T postgres psql -U geoadmin geospatial < <(gunzip -c $LATEST_BACKUP)
            docker-compose restart
            echo "✅ Rollback completed"
          fi
        ENDSSH
