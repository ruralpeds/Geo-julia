name: Vol 4 Tests

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "vol4_healthcare_platform/**"
      - ".github/workflows/test_vol4.yml"
  pull_request:
    paths:
      - "vol4_healthcare_platform/**"

jobs:
  test-pointpatterns:
    name: PointPatterns.jl — Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Instantiate PointPatterns
        run: |
          julia --project=vol4_healthcare_platform/packages/PointPatterns \
            -e 'import Pkg; Pkg.instantiate()'

      - name: Test PointPatterns
        run: |
          julia --project=vol4_healthcare_platform/packages/PointPatterns \
            -e 'import Pkg; Pkg.test()'

  test-integration:
    name: Vol 4 Integration Tests — Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    needs: test-pointpatterns
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Instantiate Vol 3 packages (SpatialStats dependency)
        run: |
          if [ -d "julia_geo_packages/packages/SpatialStats" ]; then
            julia --project=julia_geo_packages/packages/SpatialStats \
              -e 'import Pkg; Pkg.instantiate()' || true
          fi

      - name: Instantiate Vol 4 platform
        run: |
          julia --project=vol4_healthcare_platform/packages/PointPatterns \
            -e 'import Pkg; Pkg.instantiate()'

      - name: Run integration tests
        run: |
          julia --project=vol4_healthcare_platform/packages/PointPatterns \
            vol4_healthcare_platform/test/integration_test.jl
        env:
          JULIA_NUM_THREADS: "2"

  test-gpu-fallback:
    name: GPU CPU Fallback — Julia 1.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - uses: julia-actions/cache@v2

      - name: Instantiate dependencies
        run: |
          julia --project=vol4_healthcare_platform/packages/PointPatterns \
            -e 'import Pkg; Pkg.instantiate()'

      - name: Test GPU CPU fallback
        run: |
          julia --project=vol4_healthcare_platform/packages/PointPatterns \
            -e '
            include("vol4_healthcare_platform/scripts/gpu_acceleration.jl")
            @assert GPU_BACKEND[] == :none "Expected CPU fallback in CI"
            lats = 46.5 .+ randn(10)
            lons = -100.5 .+ randn(10)
            D = haversine_matrix_gpu(lats, lons)
            @assert size(D) == (10, 10)
            @assert all(D .>= 0)
            println("GPU fallback test passed")
            '
