name: Unified Integration Tests

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "unified/**"
      - "vol*/packages/*/src/**"
      - ".github/workflows/test_unified.yml"
  pull_request:
    paths:
      - "unified/**"
      - "vol*/packages/*/src/**"

jobs:
  test-unified:
    name: Cross-Volume Integration — Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2

      - name: Install unified workspace dependencies
        run: |
          julia --project=unified -e '
            import Pkg
            Pkg.instantiate()
          '

      - name: Run cross-volume integration tests
        run: |
          julia --project=unified unified/test/integration_test.jl

      - name: Run pandemic response example
        run: |
          julia --project=unified unified/examples/pandemic_response_pipeline.jl
