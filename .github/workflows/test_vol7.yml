name: Vol 7 Tests

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "vol7_deep_learning/**"
      - ".github/workflows/test_vol7.yml"
  pull_request:
    paths:
      - "vol7_deep_learning/**"

jobs:
  test-deephealth:
    name: DeepHealth.jl — Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - run: |
          julia --project=vol7_deep_learning/packages/DeepHealth \
            -e 'import Pkg; Pkg.instantiate(); Pkg.test()'

  test-bayesianhealth:
    name: BayesianHealth.jl — Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - run: |
          julia --project=vol7_deep_learning/packages/BayesianHealth \
            -e 'import Pkg; Pkg.instantiate(); Pkg.test()'

  test-integration:
    name: Vol 7 Integration
    runs-on: ubuntu-latest
    needs: [test-deephealth, test-bayesianhealth]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - run: |
          for pkg in DeepHealth BayesianHealth; do
            julia --project=vol7_deep_learning/packages/$pkg \
              -e 'import Pkg; Pkg.instantiate()'
          done
      - run: |
          julia --project=vol7_deep_learning/packages/DeepHealth \
            vol7_deep_learning/test/integration_test.jl
