name: Vol 13 — Spatial Epidemiology

on:
  push:
    paths:
      - 'vol13_spatial_epidemiology/**'
      - '.github/workflows/test_vol13.yml'
  pull_request:
    paths:
      - 'vol13_spatial_epidemiology/**'
      - '.github/workflows/test_vol13.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vol13_spatial_epidemiology

jobs:
  # ── Job 1: SurveillanceSystems ─────────────────────────────────────────────
  test-surveillance:
    name: SurveillanceSystems.jl (${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run SurveillanceSystems tests
        run: |
          julia --project=packages/SurveillanceSystems \
            -e "using Pkg; Pkg.instantiate(); include(\"packages/SurveillanceSystems/test/runtests.jl\")"

  # ── Job 2: InfectiousDisease ───────────────────────────────────────────────
  test-infectious-disease:
    name: InfectiousDisease.jl (${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run InfectiousDisease tests
        run: |
          julia --project=packages/InfectiousDisease \
            -e "using Pkg; Pkg.instantiate(); include(\"packages/InfectiousDisease/test/runtests.jl\")"

  # ── Job 3: HealthIntelligence ──────────────────────────────────────────────
  test-health-intelligence:
    name: HealthIntelligence.jl (${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run HealthIntelligence tests
        run: |
          julia --project=packages/HealthIntelligence \
            -e "using Pkg; Pkg.instantiate(); include(\"packages/HealthIntelligence/test/runtests.jl\")"

  # ── Job 4: Integration tests ───────────────────────────────────────────────
  test-integration:
    name: Integration Tests (${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    needs: [test-surveillance, test-infectious-disease, test-health-intelligence]
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run integration tests
        run: |
          julia --project=. \
            -e "using Pkg; Pkg.instantiate(); include(\"test/integration_test.jl\")"

  # ── Job 5: Vol 13 status ───────────────────────────────────────────────────
  vol13-status:
    name: Vol 13 Status
    runs-on: ubuntu-latest
    needs: [test-surveillance, test-infectious-disease, test-health-intelligence, test-integration]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "SurveillanceSystems : ${{ needs.test-surveillance.result }}"
          echo "InfectiousDisease   : ${{ needs.test-infectious-disease.result }}"
          echo "HealthIntelligence  : ${{ needs.test-health-intelligence.result }}"
          echo "Integration         : ${{ needs.test-integration.result }}"
          if [[ "${{ needs.test-surveillance.result }}"       == "success" && \
                "${{ needs.test-infectious-disease.result }}" == "success" && \
                "${{ needs.test-health-intelligence.result }}" == "success" && \
                "${{ needs.test-integration.result }}"        == "success" ]]; then
            echo "✓ Vol 13 — All tests passed"
          else
            echo "✗ Vol 13 — One or more jobs failed"
            exit 1
          fi
